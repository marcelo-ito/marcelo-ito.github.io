  <!-- Theme + route palette on <html> before any stylesheet is parsed. If the classes arrive
       later (from the app), every element runs its 0.35s colour transition once: a visible
       flash of the wrong palette plus ~1s of style recalcs on mobile.
       Mirrors useTheme.ts (storage key) and App.vue (route-* classes). -->
  <script>
    (function () {
      var root = document.documentElement
      try {
        var saved = localStorage.getItem('portfolio-theme')
        var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        if (dark) root.classList.add('dark')
      } catch (e) {}
      var page = location.pathname.replace(/\/+$/, '').split('/').pop()
      root.classList.add('route-' + (page === 'frontend' || page === 'backend' ? page : 'home'))
    })()
  </script>
