<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Preview — Deck do portfólio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
  <style>
    /* Mesmas variáveis do App.vue, para os slides herdarem o tema */
    :root {
      --color-bg: #fefae0;
      --color-surface: #faedcd;
      --color-accent1: #d4a373;
      --color-accent2: #ccd5ae;
      --color-accent3: #e9edc9;
      --color-text: #3d2b1f;
      --color-text-muted: #7c6b5a;
      --color-error: #b85c38;
      --color-success: #7c9a63;
      --color-info: #8aa399;
    }
    html.dark {
      --color-bg: #0d0f14;
      --color-surface: #141720;
      --color-accent1: #d4a373;
      --color-accent2: #4a6fa5;
      --color-accent3: #1e2a3a;
      --color-text: #e8e0d0;
      --color-text-muted: #7a8fa6;
      --color-error: #c0714a;
      --color-success: #6aab7e;
      --color-info: #5a8fa0;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--color-bg); color: var(--color-text); }

    #themeToggle {
      position: fixed; z-index: 50; top: 1.3rem; left: 1.8rem;
      font-family: 'DM Mono', ui-monospace, monospace; font-size: 0.62rem;
      letter-spacing: 0.16em; text-transform: uppercase;
      padding: 0.5rem 1rem; border-radius: 999px; cursor: pointer;
      background: transparent; color: var(--color-text);
      border: 1px solid currentColor; opacity: 0.6;
      transition: opacity 0.2s;
    }
    #themeToggle:hover { opacity: 1; }
    @media (max-width: 820px) { #themeToggle { left: 1.2rem; top: 1rem; } }
  </style>
</head>
<body>
  <button id="themeToggle" type="button">Tema</button>
  <div id="app"></div>

  <script type="module">
    import { createApp } from 'vue'
    import DeckApp from './DeckApp.vue'

    createApp(DeckApp).mount('#app')

    const toggle = document.getElementById('themeToggle')
    if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.documentElement.classList.add('dark')
    }
    toggle.addEventListener('click', () => document.documentElement.classList.toggle('dark'))
  </script>
</body>
</html>
